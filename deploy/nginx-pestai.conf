# pestai-server 反向代理（deploy/install.sh 安装为 /etc/nginx/sites-available/pestai，并删除默认站点）
# 外网只开放 80 端口：Nginx 收到请求后转发给只监听本机的后端 127.0.0.1:8080。
# 后端端口改为其他值（/etc/pestai/pestai.env 的 SERVER_PORT）后重新运行 install.sh，下面的 8080 会被自动替换。
# 手动修改本文件（如配置 HTTPS）后，install.sh 不再覆盖，新版本配置另存为 pestai.new。

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # 头像 / 识别照片 / 聊天图片上传（后端限制单张 2MB），留出余量
    client_max_body_size 10m;

    # 图片：/files/** 由后端映射到 /data/pestai/files。
    # 不用 alias 让 Nginx 直接读磁盘：后端保存图片时先建临时文件再改名，文件权限为 600（只有 pestai 用户可读），
    # Nginx 的 www-data 用户读不到会返回 403。图片名带随机 UUID、内容不会变，缓存 30 天。
    location /files/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 回答是 SSE 流式输出：关闭缓冲，收到一段转发一段（后端也会返回 X-Accel-Buffering: no）
        proxy_buffering off;
        proxy_cache off;
        # 单次回答最长 1800 秒（pestai.ai.stream-timeout-seconds），读超时多留 10 秒
        proxy_read_timeout 1810s;
        proxy_send_timeout 600s;
    }
}
